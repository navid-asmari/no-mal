<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stubete Gäng — Song Lyrics</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="layout">
    <header class="site-header">
      <h1>Stubete Gäng</h1>
      <p>Swiss German lyrics and English translations</p>
    </header>
    <div class="columns">
      <aside class="sidebar">
        <label for="search">Songs</label>
        <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
        <nav id="song-list" aria-label="Songs"><p class="muted">Loading songs…</p></nav>
      </aside>
      <section id="song-view" class="song-view" aria-live="polite">
        <p class="muted">Choose a song from the list.</p>
      </section>
    </div>
  </main>
</body>
</html>
